version: '3'
services:
  app:
    build: .
    ports:
      - "9000:9000"
      - "8000:8000"
    volumes:
      - .:/app       
      - /app/node_modules
      - ./user:/app/user 
    stdin_open: true   # Keep stdin open for the terminal
    tty: true          # Allocate a pseudo-TTY for the terminal